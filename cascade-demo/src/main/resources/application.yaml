# Spring Boot配置
spring:
  application:
    name: cascade-cache-demo

  # Redis配置 - 使用Redisson
  redis:
    redisson:
      config: |
        singleServerConfig:
          idleConnectionTimeout: 10000
          connectTimeout: 10000
          timeout: 3000
          retryAttempts: 3
          retryInterval: 1500
          password: "56445218@"
          subscriptionsPerConnection: 5
          clientName: null
          address: "redis://coderm.cc:6379"
          subscriptionConnectionMinimumIdleSize: 1
          subscriptionConnectionPoolSize: 50
          connectionMinimumIdleSize: 24
          connectionPoolSize: 64
          database: 11
          dnsMonitoringInterval: 5000
        threads: 16
        nettyThreads: 32
        codec: !<org.redisson.codec.JsonJacksonCodec> {}
        transportMode: "NIO"

# Cascade框架配置 - 仅使用L1缓存
cascade:
  # 基础配置
  enabled: true
  defaultCacheName: "myApp"

  # 通用配置
  common:
    maximumSize: 5000
    expireAfterWriteSeconds: 1800  # 30分钟
    expireAfterAccessSeconds: 900  # 15分钟
    refreshAfterWriteSeconds: 600  # 10分钟
    recordStats: true

  # L1缓存配置（本地缓存）
  l1:
    enabled: true
    maximumSize: 1000
    expireAfterWriteSeconds: 60   # 10分钟
    expireAfterAccessSeconds: 120  # 5分钟
    recordStats: true
    initialCapacity: 32
    concurrencyLevel: 8
    weakKeys: false
    weakValues: false
    softValues: true               # 使用软引用，内存不足时自动回收

  # L2缓存配置（Redis缓存）
  l2:
    enabled: true
    keyPrefix: "cascade:cache:"
    defaultTtlSeconds: 600        # 30分钟
    refreshAfterWriteSeconds: 300   # 10分钟
    enableBatch: true
    batchSize: 50
    serializer: "json"
    timeoutSeconds: 10
    # 使用Redisson配置，不需要重复配置Redis连接

  # 同步配置（多实例缓存同步）
  sync:
    enabled: true
    topic: "cascade:cache:sync"
    timeoutSeconds: 3
    async: true

  # 防护配置（防缓存穿透、击穿、雪崩）
  protection:
    enabled: true
    bloomFilter:
      enabled: true
      expectedElements: 500000
      falsePositiveRate: 0.001    # 0.1% 误判率
    randomTtl:
      enabled: true
      baseTtlSeconds: 1800        # 30分钟基础TTL
      jitterRangeSeconds: 600     # ±10分钟抖动
      jitterRatio: 0.2            # 20%抖动比例
    distributedLock:
      enabled: true
      lockTimeoutSeconds: 60
      waitTimeoutSeconds: 15
      maxRetries: 5
      retryDelayMillis: 200
      keyPrefix: "cascade:lock:"

  # 监控配置
  monitoring:
    enabled: true
    enableMetrics: true
    enableTracing: true           # 启用链路追踪
    metricsIntervalSeconds: 30    # 30秒指标收集间隔
    eventListenerClass: "com.myapp.cache.CustomCacheEventListener"
  # 刷新配置
  refresh:
    enabled: true
    defaultRefreshInterval: 5

  # Redis配置
#  data:
#    redis:
#      host: coderm.cc # 地址
#      port: 6379 # 端口
#      database: 11 # 数据库索引
#      password: 56445218@ # 密码，建议生产环境开启
#      timeout: 5s

# 日志配置
logging:
  level:
    io.github.cascade: DEBUG
    org.redisson: INFO
    root: INFO
