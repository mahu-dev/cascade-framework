# Spring Boot配置
spring:
  application:
    name: cascade-cache-demo

  # Redis配置 - 使用Redisson
  redis:
    redisson:
      config: |
        singleServerConfig:
          idleConnectionTimeout: 10000
          connectTimeout: 10000
          timeout: 3000
          retryAttempts: 3
          retryInterval: 1500
          password: "56445218@"
          subscriptionsPerConnection: 5
          clientName: null
          address: "redis://coderm.cc:6379"
          subscriptionConnectionMinimumIdleSize: 1
          subscriptionConnectionPoolSize: 50
          connectionMinimumIdleSize: 24
          connectionPoolSize: 64
          database: 11
          dnsMonitoringInterval: 5000
        threads: 16
        nettyThreads: 32
        codec: !<org.redisson.codec.JsonJacksonCodec> {}
        transportMode: "NIO"

# Cascade框架配置 - 简化配置结构
cascade:
  # 基础配置
  enabled: true
  default-cache-name: "cascade-demo"

  # L1缓存配置（本地缓存 - Caffeine）
  l1:
    enabled: true
    maximum-size: 10000
    expire-after-write-seconds: 300    # 1小时
    expire-after-access-seconds: 180   # 30分钟
    record-stats: true
    initial-capacity: 16
    concurrency-level: 4

  # L2缓存配置（Redis缓存 - Redisson）
  l2:
    enabled: true
    key-prefix: "cascade:demo:"
    default-ttl-seconds: 600           # 2小时
    enable-batch: true
    batch-size: 100
    serializer: "json"
    timeout-seconds: 5

  # 分布式同步配置
  sync:
    enabled: true
    topic-prefix: "cascade:cache:sync"
    timeout-seconds: 5

  # 自动刷新配置
  refresh:
    enabled: true  # 全局关闭，测试注解覆盖
    default-refresh-interval-seconds: 10   # 10分钟
    min-refresh-interval-seconds: 10        # 最小1分钟
    max-refresh-interval-seconds: 1800      # 最大1小时
    thread-pool-size: 2
    queue-capacity: 1000
    allow-concurrent-refresh: false
    refresh-timeout-seconds: 30             # 刷新超时30秒
    max-retries: 3
    retry-interval-seconds: 5               # 重试间隔5秒
    start-on-init: true
    shutdown-timeout-seconds: 10            # 关闭超时10秒

  # CacheLoader自动发现配置
  loader:
    auto-discover: true                 # 启用自动发现
    enable-stats: true                  # 启用统计
    timeout-seconds: 30                 # 加载超时30秒


  # Redis配置
#  data:
#    redis:
#      host: coderm.cc # 地址
#      port: 6379 # 端口
#      database: 11 # 数据库索引
#      password: 56445218@ # 密码，建议生产环境开启
#      timeout: 5s

# 日志配置
logging:
  level:
    io.github.cascade: DEBUG
    org.redisson: INFO
    root: INFO
