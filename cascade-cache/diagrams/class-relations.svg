<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#555" />
    </marker>
    <marker id="arrowHollow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,6 L10,0 L10,12 Z" fill="#fff" stroke="#455a64" />
    </marker>
    <style>
      .title { font-size: 16px; fill: #37474f; font-weight: bold; }
      .subtitle { font-size: 12px; fill: #607d8b; }
      .iface { fill:#E3F2FD; stroke:#64b5f6; }
      .klass { fill:#E8F5E9; stroke:#81c784; }
      .util { fill:#FFFDE7; stroke:#FFF176; }
      .event { fill:#F3E5F5; stroke:#BA68C8; }
      .config { fill:#FFF3E0; stroke:#FFB74D; }
      .line { stroke:#455a64; stroke-width:2; }
      .dash { stroke-dasharray:6 4; }
      .label { font-size: 11px; fill: #37474f; }
      .stereotype { font-size: 11px; fill:#546e7a; }
      .group { fill:#fafafa; stroke:#e0e0e0; }
    </style>
  </defs>

  <rect x="10" y="10" width="1380" height="880" rx="10" ry="10" class="group" />
  <text x="30" y="40" class="title">Cascade Cache 模块 - 类的引用关系图（主要类与接口）</text>
  <text x="30" y="60" class="subtitle">注：实线箭头=组合/使用，空心三角=实现/继承，虚线=创建/构建/发布</text>

  <!-- Groups -->
  <rect x="20" y="80" width="300" height="220" rx="8" class="group" />
  <text x="30" y="100" class="subtitle">API 接口</text>

  <rect x="340" y="80" width="380" height="380" rx="8" class="group" />
  <text x="350" y="100" class="subtitle">核心与策略</text>

  <rect x="740" y="80" width="300" height="220" rx="8" class="group" />
  <text x="750" y="100" class="subtitle">构建与管理</text>

  <rect x="1060" y="80" width="320" height="340" rx="8" class="group" />
  <text x="1070" y="100" class="subtitle">监控与事件/同步</text>

  <rect x="20" y="320" width="300" height="140" rx="8" class="group" />
  <text x="30" y="340" class="subtitle">配置与异常</text>

  <!-- API Interfaces -->
  <rect x="40" y="120" width="120" height="50" rx="6" class="iface" />
  <text x="100" y="138" text-anchor="middle" class="stereotype">«interface»</text>
  <text x="100" y="155" text-anchor="middle" class="label">Cache&lt;K,V&gt;</text>

  <rect x="180" y="120" width="120" height="50" rx="6" class="iface" />
  <text x="240" y="138" text-anchor="middle" class="stereotype">«interface»</text>
  <text x="240" y="155" text-anchor="middle" class="label">AsyncCache&lt;K,V&gt;</text>

  <rect x="40" y="190" width="120" height="50" rx="6" class="iface" />
  <text x="100" y="208" text-anchor="middle" class="stereotype">«interface»</text>
  <text x="100" y="225" text-anchor="middle" class="label">TieredCache&lt;K,V&gt;</text>

  <rect x="180" y="190" width="120" height="50" rx="6" class="iface" />
  <text x="240" y="208" text-anchor="middle" class="stereotype">«interface»</text>
  <text x="240" y="225" text-anchor="middle" class="label">CacheLoader&lt;K,V&gt;</text>

  <rect x="40" y="380" width="120" height="50" rx="6" class="iface" />
  <text x="100" y="398" text-anchor="middle" class="stereotype">«interface»</text>
  <text x="100" y="415" text-anchor="middle" class="label">CacheManager</text>

  <rect x="180" y="380" width="120" height="50" rx="6" class="iface" />
  <text x="240" y="398" text-anchor="middle" class="stereotype">«interface»</text>
  <text x="240" y="415" text-anchor="middle" class="label">CacheFactory</text>

  <!-- Core and Strategy -->
  <rect x="360" y="120" width="140" height="55" rx="6" class="klass" />
  <text x="430" y="140" text-anchor="middle" class="label">SmartCache&lt;K,V&gt;</text>
  <text x="430" y="156" text-anchor="middle" class="stereotype">核心门面</text>

  <rect x="360" y="200" width="140" height="50" rx="6" class="klass" />
  <text x="430" y="230" text-anchor="middle" class="label">CacheCore&lt;K,V&gt;</text>

  <rect x="520" y="200" width="140" height="50" rx="6" class="klass" />
  <text x="590" y="230" text-anchor="middle" class="label">CacheEnhancer&lt;K,V&gt;</text>

  <rect x="520" y="270" width="140" height="50" rx="6" class="klass" />
  <text x="590" y="300" text-anchor="middle" class="label">CacheMonitor&lt;K,V&gt;</text>

  <rect x="360" y="270" width="140" height="50" rx="6" class="iface" />
  <text x="430" y="288" text-anchor="middle" class="stereotype">«interface»</text>
  <text x="430" y="305" text-anchor="middle" class="label">CacheStrategy&lt;K,V&gt;</text>

  <rect x="360" y="340" width="140" height="50" rx="6" class="klass" />
  <text x="430" y="370" text-anchor="middle" class="label">SingleTier…</text>

  <rect x="520" y="340" width="140" height="50" rx="6" class="klass" />
  <text x="590" y="370" text-anchor="middle" class="label">MultiTier…</text>

  <!-- Build & Manage -->
  <rect x="760" y="120" width="140" height="50" rx="6" class="klass" />
  <text x="830" y="150" text-anchor="middle" class="label">UnifiedCacheBuilder</text>

  <rect x="920" y="120" width="120" height="50" rx="6" class="klass" />
  <text x="980" y="150" text-anchor="middle" class="label">SmartCacheFactory</text>

  <rect x="920" y="190" width="120" height="50" rx="6" class="klass" />
  <text x="980" y="220" text-anchor="middle" class="label">CascadeCacheManager</text>

  <!-- Monitoring & Events -->
  <rect x="1080" y="120" width="160" height="50" rx="6" class="klass" />
  <text x="1160" y="150" text-anchor="middle" class="label">UnifiedMonitoringManager</text>

  <rect x="1260" y="120" width="100" height="50" rx="6" class="klass" />
  <text x="1310" y="150" text-anchor="middle" class="label">MetricsCollector</text>

  <rect x="1080" y="190" width="160" height="50" rx="6" class="event" />
  <text x="1160" y="220" text-anchor="middle" class="label">UnifiedEventProcessor</text>

  <rect x="1260" y="190" width="100" height="50" rx="6" class="iface" />
  <text x="1310" y="208" text-anchor="middle" class="stereotype">«interface»</text>
  <text x="1310" y="225" text-anchor="middle" class="label">CacheEventListener</text>

  <rect x="1080" y="260" width="160" height="50" rx="6" class="klass" />
  <text x="1160" y="290" text-anchor="middle" class="label">UnifiedCacheSynchronizer</text>

  <rect x="1260" y="260" width="100" height="50" rx="6" class="iface" />
  <text x="1310" y="278" text-anchor="middle" class="stereotype">«interface»</text>
  <text x="1310" y="295" text-anchor="middle" class="label">CacheSynchronizer</text>

  <rect x="1080" y="330" width="160" height="50" rx="6" class="klass" />
  <text x="1160" y="360" text-anchor="middle" class="label">CacheRefreshScheduler</text>

  <!-- Config & Exception -->
  <rect x="40" y="520" width="200" height="50" rx="6" class="config" />
  <text x="140" y="550" text-anchor="middle" class="label">CascadeCacheConfiguration</text>

  <rect x="260" y="520" width="200" height="50" rx="6" class="util" />
  <text x="360" y="550" text-anchor="middle" class="label">CacheExceptionHandler</text>

  <!-- Relationships -->
  <!-- Inheritance / Implementation (hollow triangle) -->
  <line x1="430" y1="120" x2="100" y2="170" class="line" marker-end="url(#arrowHollow)" />
  <text x="250" y="145" class="label">implements</text>

  <line x1="430" y1="120" x2="240" y2="170" class="line" marker-end="url(#arrowHollow)" />
  <line x1="430" y1="120" x2="100" y2="210" class="line" marker-end="url(#arrowHollow)" />

  <line x1="240" y1="170" x2="100" y2="145" class="line" marker-end="url(#arrowHollow)" />
  <text x="160" y="140" class="label">extends</text>

  <line x1="100" y1="215" x2="100" y2="170" class="line" marker-end="url(#arrowHollow)" />
  <text x="110" y="192" class="label">extends</text>

  <line x1="400" y1="295" x2="430" y2="270" class="line" marker-end="url(#arrowHollow)" />
  <text x="385" y="285" class="label">uses</text>

  <line x1="520" y1="365" x2="430" y2="295" class="line" marker-end="url(#arrowHollow)" />
  <text x="478" y="330" class="label">implements</text>
  <line x1="590" y1="365" x2="430" y2="295" class="line" marker-end="url(#arrowHollow)" />

  <!-- Composition / Usage (solid arrow) -->
  <line x1="430" y1="175" x2="430" y2="200" class="line" marker-end="url(#arrow)" />
  <text x="440" y="190" class="label">compose</text>

  <line x1="430" y1="175" x2="590" y2="225" class="line" marker-end="url(#arrow)" />
  <text x="520" y="195" class="label">use</text>

  <line x1="430" y1="175" x2="590" y2="295" class="line" marker-end="url(#arrow)" />
  <text x="520" y="245" class="label">monitor</text>

  <line x1="430" y1="225" x2="430" y2="270" class="line" marker-end="url(#arrow)" />
  <text x="440" y="248" class="label">use</text>

  <line x1="430" y1="225" x2="240" y2="215" class="line" marker-end="url(#arrow)" />
  <text x="310" y="210" class="label">loader</text>

  <!-- Builder / Factory / Manager (dashed) -->
  <line x1="830" y1="170" x2="430" y2="150" class="line dash" marker-end="url(#arrow)" />
  <text x="640" y="145" class="label">build</text>

  <line x1="980" y1="170" x2="830" y2="145" class="line dash" marker-end="url(#arrow)" />
  <text x="925" y="140" class="label">use</text>

  <line x1="980" y1="240" x2="980" y2="170" class="line dash" marker-end="url(#arrow)" />
  <text x="990" y="210" class="label">manage</text>

  <!-- Monitoring & Events relations -->
  <line x1="590" y1="295" x2="1160" y2="145" class="line" marker-end="url(#arrow)" />
  <text x="915" y="210" class="label">report</text>

  <line x1="1160" y1="170" x2="1310" y2="145" class="line" marker-end="url(#arrow)" />
  <text x="1235" y="140" class="label">collect</text>

  <line x1="980" y1="215" x2="1160" y2="215" class="line" marker-end="url(#arrow)" />
  <text x="1070" y="210" class="label">publish events</text>

  <line x1="1160" y1="215" x2="1310" y2="215" class="line" marker-end="url(#arrow)" />
  <text x="1235" y="210" class="label">notify</text>

  <line x1="1160" y1="310" x2="1310" y2="285" class="line" marker-end="url(#arrow)" />
  <text x="1220" y="300" class="label">sync</text>

  <line x1="1160" y1="360" x2="830" y2="145" class="line dash" marker-end="url(#arrow)" />
  <text x="1000" y="250" class="label">schedule refresh</text>

  <!-- Config & Exception relations -->
  <line x1="430" y1="225" x2="140" y2="520" class="line" marker-end="url(#arrow)" />
  <text x="300" y="420" class="label">apply config</text>

  <line x1="430" y1="150" x2="360" y2="520" class="line" marker-end="url(#arrow)" />
  <text x="390" y="330" class="label">handle errors</text>
</svg>