<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="480" viewBox="0 0 980 480" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#555" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#1976d2" />
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#2e7d32" />
    </marker>
  </defs>

  <rect x="10" y="10" width="960" height="460" rx="8" ry="8" fill="#fafafa" stroke="#e0e0e0" />

  <!-- Nodes -->
  <rect x="60" y="60" width="200" height="50" rx="6" fill="#e8f5e9" stroke="#81c784" />
  <text x="160" y="90" text-anchor="middle" font-size="13" fill="#1b5e20">节点 A - SmartCache</text>

  <rect x="60" y="140" width="200" height="50" rx="6" fill="#f3e5f5" stroke="#ba68c8" />
  <text x="160" y="170" text-anchor="middle" font-size="12" fill="#4a148c">UnifiedEventProcessor</text>

  <rect x="360" y="140" width="220" height="50" rx="6" fill="#ede7f6" stroke="#9575cd" />
  <text x="470" y="170" text-anchor="middle" font-size="12" fill="#311b92">消息通道：Redis Pub/Sub</text>

  <rect x="680" y="60" width="200" height="50" rx="6" fill="#e8f5e9" stroke="#81c784" />
  <text x="780" y="90" text-anchor="middle" font-size="13" fill="#1b5e20">节点 B - SmartCache</text>

  <rect x="680" y="220" width="220" height="50" rx="6" fill="#fff3e0" stroke="#ffb74d" />
  <text x="790" y="250" text-anchor="middle" font-size="12" fill="#e65100">CacheRefreshScheduler</text>

  <!-- Sync Flow -->
  <text x="60" y="30" font-size="14" fill="#424242">分布式同步 (Put/Evict)</text>

  <line x1="160" y1="115" x2="160" y2="140" stroke="#1976d2" stroke-width="2" marker-end="url(#arrowBlue)" />
  <text x="170" y="132" font-size="11" fill="#1565c0">1. 发布事件</text>

  <line x1="260" y1="165" x2="360" y2="165" stroke="#1976d2" stroke-width="2" marker-end="url(#arrowBlue)" />
  <text x="310" y="156" font-size="11" fill="#1565c0" text-anchor="middle">2. 广播</text>

  <line x1="580" y1="165" x2="680" y2="85" stroke="#1976d2" stroke-width="2" marker-end="url(#arrowBlue)" />
  <text x="630" y="120" font-size="11" fill="#1565c0" text-anchor="middle">3. 订阅接收</text>

  <line x1="780" y1="110" x2="780" y2="140" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowGreen)" />
  <text x="790" y="128" font-size="11" fill="#2e7d32">4. 失效/更新 L1</text>

  <!-- Auto Refresh -->
  <text x="60" y="210" font-size="14" fill="#424242">自动刷新 (EnableAutoRefresh)</text>

  <line x1="790" y1="220" x2="790" y2="110" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowGreen)" />
  <text x="800" y="168" font-size="11" fill="#2e7d32">1. 调度触发</text>

  <rect x="680" y="300" width="220" height="50" rx="6" fill="#ede7f6" stroke="#9575cd" />
  <text x="790" y="330" text-anchor="middle" font-size="12" fill="#311b92">CacheLoader</text>

  <rect x="680" y="380" width="220" height="50" rx="6" fill="#fffde7" stroke="#fff176" />
  <text x="790" y="410" text-anchor="middle" font-size="12" fill="#f57f17">DB/Upstream</text>

  <line x1="790" y1="270" x2="790" y2="300" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowGreen)" />
  <text x="800" y="292" font-size="11" fill="#2e7d32">2. 调用 Loader</text>

  <line x1="790" y1="350" x2="790" y2="380" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowGreen)" />
  <text x="800" y="372" font-size="11" fill="#2e7d32">3. 访问数据源</text>

  <line x1="680" y1="325" x2="260" y2="325" stroke="#1976d2" stroke-width="2" marker-end="url(#arrowBlue)" />
  <text x="470" y="315" font-size="11" fill="#1565c0" text-anchor="middle">4. 发布刷新事件 (更新/失效)</text>

  <line x1="260" y1="325" x2="160" y2="85" stroke="#1976d2" stroke-width="2" marker-end="url(#arrowBlue)" />
  <text x="210" y="198" font-size="11" fill="#1565c0" text-anchor="middle">5. 本地 L1 更新</text>
</svg>