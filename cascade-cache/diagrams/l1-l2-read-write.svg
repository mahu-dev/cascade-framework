<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#555" />
    </marker>
  </defs>

  <rect x="10" y="10" width="960" height="400" rx="8" ry="8" fill="#fafafa" stroke="#e0e0e0" />

  <!-- Nodes -->
  <rect x="40" y="60" width="110" height="40" rx="6" fill="#e3f2fd" stroke="#64b5f6" />
  <text x="95" y="85" text-anchor="middle" font-size="13" fill="#0d47a1">Client</text>

  <rect x="190" y="60" width="140" height="40" rx="6" fill="#e8f5e9" stroke="#81c784" />
  <text x="260" y="85" text-anchor="middle" font-size="13" fill="#1b5e20">SmartCache</text>

  <rect x="370" y="40" width="150" height="40" rx="6" fill="#fff3e0" stroke="#ffb74d" />
  <text x="445" y="65" text-anchor="middle" font-size="12" fill="#e65100">L1: Caffeine</text>

  <rect x="370" y="130" width="150" height="40" rx="6" fill="#f3e5f5" stroke="#ba68c8" />
  <text x="445" y="155" text-anchor="middle" font-size="12" fill="#4a148c">L2: Redis</text>

  <rect x="560" y="130" width="150" height="40" rx="6" fill="#ede7f6" stroke="#9575cd" />
  <text x="635" y="155" text-anchor="middle" font-size="12" fill="#311b92">CacheLoader</text>

  <rect x="750" y="130" width="170" height="40" rx="6" fill="#fffde7" stroke="#fff176" />
  <text x="835" y="155" text-anchor="middle" font-size="12" fill="#f57f17">DB/Upstream</text>

  <!-- Read Path -->
  <text x="40" y="30" font-size="14" fill="#424242">读路径 (Get)</text>
  <line x1="150" y1="80" x2="190" y2="80" stroke="#555" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="330" y1="80" x2="370" y2="60" stroke="#4caf50" stroke-width="2" marker-end="url(#arrow)" />
  <text x="350" y="54" font-size="11" fill="#2e7d32">1. L1 查询</text>

  <line x1="330" y1="80" x2="370" y2="150" stroke="#f57c00" stroke-width="2" marker-end="url(#arrow)" />
  <text x="340" y="118" font-size="11" fill="#e65100">2. L1 Miss → L2 查询</text>

  <line x1="520" y1="150" x2="560" y2="150" stroke="#f57c00" stroke-width="2" marker-end="url(#arrow)" />
  <text x="540" y="140" font-size="11" fill="#e65100">3. L2 Miss → 加载</text>

  <line x1="710" y1="150" x2="750" y2="150" stroke="#f57c00" stroke-width="2" marker-end="url(#arrow)" />
  <text x="730" y="140" font-size="11" fill="#e65100">4. 访问数据源</text>

  <line x1="750" y1="170" x2="560" y2="170" stroke="#0288d1" stroke-width="2" marker-end="url(#arrow)" />
  <text x="655" y="186" font-size="11" fill="#01579b" text-anchor="middle">5. 数据返回</text>

  <line x1="560" y1="170" x2="520" y2="170" stroke="#0288d1" stroke-width="2" marker-end="url(#arrow)" />
  <text x="540" y="182" font-size="11" fill="#01579b">6. 回填 L2</text>

  <line x1="370" y1="170" x2="330" y2="100" stroke="#0288d1" stroke-width="2" marker-end="url(#arrow)" />
  <text x="350" y="182" font-size="11" fill="#01579b">7. 回填 L1</text>

  <line x1="190" y1="100" x2="150" y2="100" stroke="#0288d1" stroke-width="2" marker-end="url(#arrow)" />
  <text x="170" y="112" font-size="11" fill="#01579b">8. 返回给 Client</text>

  <!-- Write Path -->
  <text x="40" y="230" font-size="14" fill="#424242">写路径 (Put)</text>
  <rect x="40" y="245" width="300" height="120" rx="8" fill="#ffffff" stroke="#eeeeee" />
  <text x="60" y="270" font-size="12" fill="#616161">写入策略（默认 Write-Through）</text>

  <line x1="150" y1="300" x2="190" y2="300" stroke="#555" stroke-width="2" marker-end="url(#arrow)" />
  <text x="90" y="296" font-size="11" fill="#424242">Client → SmartCache</text>

  <line x1="330" y1="300" x2="370" y2="280" stroke="#6d4c41" stroke-width="2" marker-end="url(#arrow)" />
  <text x="350" y="274" font-size="11" fill="#4e342e">1. 写 L1</text>

  <line x1="330" y1="300" x2="370" y2="330" stroke="#6d4c41" stroke-width="2" marker-end="url(#arrow)" />
  <text x="350" y="344" font-size="11" fill="#4e342e">2. 写 L2</text>

  <text x="60" y="330" font-size="11" fill="#616161">可配置：Write-Behind、异步批量、随机TTL、防穿透等</text>
</svg>