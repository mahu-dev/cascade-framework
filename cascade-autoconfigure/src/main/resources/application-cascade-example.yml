# Cascade缓存配置示例
cascade:
  cache:
    # 是否启用缓存
    enabled: true
    
    # 默认缓存配置
    defaults:
      # 是否启用
      enabled: true
      # 默认过期时间
      default-expiration: PT1H  # 1小时
      # 是否记录统计信息
      record-stats: true
      # 是否允许null值
      allow-null-values: true
      
      # L1缓存配置 (本地内存缓存)
      l1:
        enabled: true
        maximum-size: 10000
        initial-capacity: 16
        concurrency-level: 4
        expire-after-write: PT30M    # 30分钟
        expire-after-access: PT2H    # 2小时
        refresh-after-write: PT10M   # 10分钟
        record-stats: true
        weak-keys: false
        weak-values: false
        soft-values: false
        
      # L2缓存配置 (Redis远程缓存)  
      l2:
        enabled: true
        key-prefix: "cascade:"
        serializer: json  # json, kryo, jdk
        default-ttl: PT24H    # 24小时
        timeout: PT5S         # 5秒
        record-stats: true
        
        # Redis配置
        redis:
          host: localhost
          port: 6379
          database: 0
          password: 
          timeout: PT5S
          pool-max-total: 8
          pool-max-idle: 8
          pool-min-idle: 0
          
        # 压缩配置
        compression:
          enabled: false
          type: gzip
          threshold: 1024
    
    # 同步配置
    sync:
      enabled: true
      
    # 预热配置
    warmup:
      enabled: false
    
    # 特定缓存配置
    caches:
      user-cache:
        enabled: true
        default-expiration: PT2H
        l1:
          enabled: true
          maximum-size: 5000
          expire-after-access: PT1H
        l2:
          enabled: true
          key-prefix: "user:"
          default-ttl: PT12H
          
      product-cache:
        enabled: true
        default-expiration: PT6H
        l1:
          enabled: true
          maximum-size: 20000
          expire-after-write: PT3H
        l2:
          enabled: true
          key-prefix: "product:"
          default-ttl: PT24H

# Spring Boot Redis配置 (如果使用单独的Redis配置)
spring:
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# 日志配置
logging:
  level:
    io.github.cascade.cache: DEBUG
    io.github.cascade.autoconfigure: DEBUG